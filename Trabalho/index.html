
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sistema de Notas</h1>

    <form id="formulario">
        <input type="text" id="nome" placeholder="Nome do aluno" required>
        <input type="number" id="nota1" placeholder="Nota 1" min="0" max="10" step="0.1" required>
        <input type="number" id="nota2" placeholder="Nota 2" min="0" max="10" step="0.1" required>

        <button type="submit">Adicionar aluno</button>
    </form>

    <h2>Alunos cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Média</th>
                <th>Situação</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
