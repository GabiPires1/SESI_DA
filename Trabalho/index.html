<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas Escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sistema de Notas Escolares</h1>

    <div class="container">
        <h2>Cadastrar aluno</h2>

        <form id="formulario">
            <label>Nome do aluno:</label>
            <input type="text" id="nome" required>

            <label>Matéria:</label>
            <input type="text" id="materia" required>

            <label>Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required>

            <label>Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required>

            <button type="submit">Adicionar nota</button>
        </form>
    </div>

    <div class="container">
        <h2>Notas cadastradas</h2>

        <input type="text" id="busca" placeholder="Buscar aluno ou matéria">

        <table>
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Matéria</th>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                    <th>Média</th>
                    <th>Situação</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="tabela"></tbody>
        </table>

        <p id="resumo"></p>

        <button id="apagarTudo" class="secundario" type="button">
            Apagar todos
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
